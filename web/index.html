<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix BFF | Web Client</title>
    <style>
        :root {
            --bg-dark: #121212; --bg-panel: #1e1e2e; --bg-input: #2a2a3b;
            --text-main: #e0e0e0; --text-muted: #8b8b9e;
            --primary: #7289da; --primary-hover: #5b6eae;
            --bubble-recv: #2a2a3b; --bubble-sent: #7289da;
            --sidebar-width: 320px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        input { background-color: var(--bg-input); border: 1px solid #444; color: #fff; padding: 12px; border-radius: 6px; outline: none; width: 100%; margin-bottom: 15px;}
        input:focus { border-color: var(--primary); }
        button { background-color: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #444; cursor: not-allowed; }

        #auth-screen { display: flex; width: 100%; height: 100%; justify-content: center; align-items: center; background-color: var(--bg-dark); }
        .auth-card { background-color: var(--bg-panel); padding: 40px; border-radius: 8px; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .auth-card h2 { text-align: center; margin-bottom: 25px; color: #fff; }
        .status-msg { text-align: center; font-size: 0.85rem; margin-top: 10px; height: 20px; }

        #app-screen { display: none; width: 100%; height: 100%; flex-direction: row; }

        #sidebar { width: var(--sidebar-width); background-color: var(--bg-panel); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background-color: rgba(0,0,0,0.2); border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 10px;}
        .sidebar-header h3 { font-size: 1rem; color: #fff; }
        
        .room-actions { padding: 15px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #333; }
        .room-actions button { flex: 1; padding: 8px; font-size: 0.8rem; }
        .btn-fed { background-color: #00796b !important; } .btn-fed:hover { background-color: #004d40 !important; }

        .room-list { flex-grow: 1; overflow-y: auto; }
        .room-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #2a2a3b; transition: 0.2s; }
        .room-item:hover, .room-item.active { background-color: var(--bg-input); }
        .room-item-name { font-weight: bold; font-size: 0.95rem; }
        .room-item-id { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; word-break: break-all; }

        #chat-area { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-dark); position: relative; }
        #chat-header { padding: 20px; background-color: var(--bg-panel); border-bottom: 1px solid #333; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #sys-status { font-size: 0.8rem; color: var(--primary); font-weight: normal; }

        #messages-container { flex-grow: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        .message-wrapper { display: flex; flex-direction: column; max-width: 65%; }
        .message-wrapper.recv { align-self: flex-start; }
        .message-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        
        .message-sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .message-bubble { padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .recv .message-bubble { background-color: var(--bubble-recv); border-top-left-radius: 0; }
        .sent .message-bubble { background-color: var(--bubble-sent); border-top-right-radius: 0; color: #fff; }
        .message-time { font-size: 0.7rem; margin-top: 5px; color: var(--text-muted); }

        .media-container { margin-top: 8px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; }
        .media-container img, .media-container video { max-width: 100%; max-height: 300px; border-radius: 5px; }
        .btn-download { background: #444; font-size: 0.8rem; padding: 8px 12px; margin-top: 5px; display: inline-block; text-decoration: none; color: #fff; border-radius: 4px; cursor: pointer; border: none;}
        .btn-download:hover { background: #555; }

        #input-area { padding: 15px 20px; background-color: var(--bg-panel); display: flex; gap: 15px; align-items: center; }
        #input-msg { flex-grow: 1; background-color: var(--bg-input); border: none; padding: 15px; color: #fff; border-radius: 8px; outline: none; margin: 0; }
        #btn-attach { background-color: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; padding: 0 10px; }
        #btn-attach:hover { color: var(--primary); }
        #file-input-hidden { display: none; }
        #btn-send { width: auto; padding: 12px 25px; }

        /* Modal Federação */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-panel); width: 600px; max-height: 80vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { padding: 20px; background: var(--bg-input); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .fed-room-card { background: var(--bg-dark); padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .fed-room-info h4 { margin-bottom: 5px; font-size: 1rem; }
        .fed-room-info span { font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

<div class="modal-overlay" id="modal-fed">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🌐 Diretório da Federação</h3>
            <button onclick="fecharModalFed()" style="width:auto; padding: 6px 12px; background: #c62828">Fechar</button>
        </div>
        <div class="modal-body">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="fed-server-input" placeholder="Servidor Alvo (ex: matrix.org)" value="matrix.org" style="margin-bottom:0;">
                <button onclick="buscarFederacao()" style="width:120px;">Pesquisar</button>
            </div>
            <div id="fed-results" style="display:flex; flex-direction:column; gap:10px; color: var(--text-muted); font-size:0.9rem;">
                Insira o domínio de um Homeserver público e clique em pesquisar.
            </div>
        </div>
    </div>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h2>Matrix BFF L4/L7</h2>
        <input type="text" id="homeserver" placeholder="Seu Homeserver (ex: localhost:8008)">
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="passwd" placeholder="Senha">
        <button id="btn-login" onclick="conectar()">Autenticar</button>
        <div id="auth-status" class="status-msg"></div>
    </div>
</div>

<div id="app-screen">
    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Conectado como</h3>
            <span id="logged-user-display" style="font-size: 0.9rem; color: var(--text-muted)"></span>
        </div>
        <div class="room-actions">
            <button onclick="promptCriarSala()">+ Criar</button>
            <button onclick="promptEntrarSala()">Entrar</button>
            <button onclick="abrirModalFed()" class="btn-fed">🌐 Explorar</button>
        </div>
        <div class="room-list" id="lista-salas-container">
            <div style="padding: 15px; color: var(--text-muted); font-size: 0.85rem; text-align: center;">Sincronizando Estado...</div>
        </div>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <span id="current-room-display">Nenhuma sala selecionada</span>
            <span id="sys-status">Bare-Metal TCP Ocioso</span>
        </div>
        <div id="messages-container"></div>
        <div id="input-area">
            <label id="btn-attach" for="file-input-hidden" title="Anexar Ficheiro">📎</label>
            <input type="file" id="file-input-hidden" onchange="processarUpload()">
            <input type="text" id="input-msg" placeholder="Selecione uma sala..." disabled onkeypress="verificarEnter(event)">
            <button id="btn-send" onclick="enviarMensagem()" disabled>Enviar</button>
            <input type="hidden" id="active-room-id" value="">
        </div>
    </div>
</div>

<script>
    let ws;
    let userIdLocal = "";
    const msgContainer = document.getElementById('messages-container');
    const sysStatus = document.getElementById('sys-status');
    const authStatus = document.getElementById('auth-status');
    let listaSalas = [];

    function mostrarErro(mensagem) {
        const t = document.createElement('div');
        t.style.background = '#c62828'; t.style.color = '#fff';
        t.style.padding = '12px 20px'; t.style.borderRadius = '5px';
        t.style.boxShadow = '0 2px 10px rgba(0,0,0,0.5)';
        t.innerText = "L4/L7 Falha: " + mensagem;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 5000);
    }

    function formatarTempo(ts) {
        if (!ts) return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function scrollBottom() {
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function renderizarListaSalas() {
        const container = document.getElementById('lista-salas-container');
        container.innerHTML = "";
        listaSalas.forEach(sala => {
            const div = document.createElement('div');
            div.className = 'room-item';
            div.id = `nav-${sala.id}`;
            div.onclick = () => selecionarSala(sala.id, sala.nome);
            div.innerHTML = `<div class="room-item-name">${sala.nome}</div><div class="room-item-id">${sala.id}</div>`;
            container.appendChild(div);
        });
    }

    function promptCriarSala() {
        const nome = prompt("Defina o Nome da nova Sala:");
        if (!nome) return;
        const alias = prompt("Alias local opcional (sem prefixo #):");
        ws.send(JSON.stringify({acao: "criar_sala", nome: nome, alias: alias || ""}));
    }

    function promptEntrarSala() {
        const ref = prompt("Informe o ID da Sala ou Alias para ingressar (ex: !abc:localhost ou #sala:matrix.org):");
        if (!ref) return;
        const srv = prompt("Servidor de Roteamento SNI (Deixe em branco se for local, ou preencha com matrix.org etc):");
        ws.send(JSON.stringify({acao: "entrar_sala", referencia: ref, servidor_federacao: srv || null}));
    }

    function abrirModalFed() { document.getElementById('modal-fed').style.display = 'flex'; }
    function fecharModalFed() { document.getElementById('modal-fed').style.display = 'none'; }
    function buscarFederacao() {
        const srv = document.getElementById('fed-server-input').value;
        document.getElementById('fed-results').innerHTML = "Buscando catálogo no L4...";
        ws.send(JSON.stringify({acao: "listar_federacao", servidor: srv}));
    }
    function ingressarFederacao(alias) {
        const srv = document.getElementById('fed-server-input').value;
        ws.send(JSON.stringify({acao: "entrar_sala", referencia: alias, servidor_federacao: srv}));
        fecharModalFed();
    }

    function selecionarSala(salaId, salaNome) {
        document.getElementById('active-room-id').value = salaId;
        document.getElementById('current-room-display').innerText = salaNome;
        
        document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
        const activeNav = document.getElementById(`nav-${salaId}`);
        if(activeNav) activeNav.classList.add('active');

        document.getElementById('input-msg').disabled = false;
        document.getElementById('input-msg').placeholder = "Escreva uma mensagem...";
        document.getElementById('btn-send').disabled = false;

        msgContainer.innerHTML = "";
        sysStatus.innerText = "Requisitando histórico paginado L7...";
        ws.send(JSON.stringify({acao: "buscar_historico", sala: salaId}));
    }

    function construirBolhaHTML(remetente, texto, isOwn, ts, mxc = null) {
        const wrapClass = isOwn ? 'sent' : 'recv';
        const displayNome = isOwn ? 'Você' : remetente;
        const timeStr = formatarTempo(ts);
        const mxcClean = mxc ? mxc.replace(/[^a-zA-Z0-9]/g, '') : '';
        
        let contentHTML = `<div class="message-bubble">${texto}</div>`;
        
        if (mxc) {
            contentHTML = `
            <div class="message-bubble">
                <i>Anexo L7: ${texto}</i>
                <div class="media-container" id="media_${mxcClean}">
                    <button class="btn-download" onclick="solicitarStream('${mxc}', '${mxcClean}')">⬇️ Descarregar Stream Binário</button>
                </div>
            </div>`;
        }

        return `
        <div class="message-wrapper ${wrapClass}">
            ${!isOwn ? `<div class="message-sender">${displayNome}</div>` : ''}
            ${contentHTML}
            <div class="message-time">${timeStr}</div>
        </div>`;
    }

    function conectar() {
        const hs = document.getElementById('homeserver').value;
        const us = document.getElementById('user').value;
        const pw = document.getElementById('passwd').value;

        if(!hs || !us || !pw) return;

        authStatus.innerText = "Negociando Handshake WebSocket...";
        ws = new WebSocket("ws://localhost:8765");
        
        ws.onopen = () => {
            authStatus.innerText = "Autenticando no Homeserver...";
            ws.send(JSON.stringify({acao: "login", homeserver: hs, usuario: us, senha: pw}));
        };

        ws.onmessage = (e) => {
            const dados = JSON.parse(e.data);
            
            if (dados.tipo === "erro") {
                mostrarErro(dados.mensagem);
            }
            else if (dados.tipo === "status") {
                if (dados.sucesso) {
                    userIdLocal = dados.user_id;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    document.getElementById('logged-user-display').innerText = userIdLocal;
                    sysStatus.innerText = "Asyncio Syncing L7...";
                } else {
                    authStatus.innerText = dados.mensagem;
                    authStatus.style.color = "#c62828";
                }
            }
            else if (dados.tipo === "salas_iniciais") {
                listaSalas = dados.salas;
                renderizarListaSalas();
            }
            else if (dados.tipo === "sala_criada" || dados.tipo === "sala_entrou") {
                sysStatus.innerText = "Sala conectada na pipeline L4!";
                
                // Evita criar itens duplicados caso já exista
                if (!listaSalas.some(s => s.id === dados.room_id)) {
                    listaSalas.push({id: dados.room_id, nome: dados.nome || dados.room_id});
                    renderizarListaSalas();
                }
                
                // Transiciona a UI para focar na nova sala sem matar o socket TCP
                selecionarSala(dados.room_id, dados.nome || dados.room_id);
            }
            else if (dados.tipo === "resultado_federacao") {
                const res = document.getElementById('fed-results');
                res.innerHTML = "";
                if(dados.salas.length === 0) res.innerHTML = "Nenhuma sala pública encontrada.";
                dados.salas.forEach(s => {
                    res.innerHTML += `
                        <div class="fed-room-card">
                            <div class="fed-room-info">
                                <h4>${s.name || s.canonical_alias}</h4>
                                <span>${s.canonical_alias} | ${s.num_joined_members} membros</span>
                            </div>
                            <button onclick="ingressarFederacao('${s.canonical_alias}')" style="width:auto; padding:8px 15px;">Entrar</button>
                        </div>
                    `;
                });
            }
            else if (dados.tipo === "historico") {
                if(document.getElementById('active-room-id').value === dados.sala) {
                    msgContainer.innerHTML = "";
                    dados.mensagens.forEach(msg => {
                        msgContainer.innerHTML += construirBolhaHTML(msg.remetente, msg.texto, msg.propria, msg.timestamp, msg.url);
                    });
                    scrollBottom();
                    sysStatus.innerText = "Histórico processado.";
                }
            }
            else if (dados.tipo === "mensagem") {
                const salaAtiva = document.getElementById('active-room-id').value;
                if (salaAtiva === dados.sala) {
                    msgContainer.innerHTML += construirBolhaHTML(dados.remetente, dados.texto, dados.propria, dados.timestamp, dados.url);
                    scrollBottom();
                }
            }
            else if (dados.tipo === "status_midia") {
                sysStatus.innerText = dados.sucesso ? "Upload Concluído" : "Erro no Upload";
            }
            else if (dados.tipo === "midia_baixada") {
                renderizarMidia(dados.mxc, dados.mime_type, dados.base64);
            }
        };
        
        ws.onclose = () => {
            if(document.getElementById('app-screen').style.display === 'flex') alert("Conexão com o Gateway BFF perdida.");
            else authStatus.innerText = "Falha ao conectar no Gateway WS (8765).";
        };
    }

    function verificarEnter(e) { if (e.key === 'Enter') enviarMensagem(); }

    function enviarMensagem() {
        const input = document.getElementById('input-msg');
        const sala = document.getElementById('active-room-id').value;
        const texto = input.value.trim();
        
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (sala === "" || texto === "") return;

        ws.send(JSON.stringify({acao: "enviar", sala: sala, texto: texto}));
        input.value = "";
    }

    function processarUpload() {
        const sala = document.getElementById('active-room-id').value;
        const fileInput = document.getElementById('file-input-hidden');
        if (fileInput.files.length === 0 || sala === "") return;

        const arquivo = fileInput.files[0];
        const reader = new FileReader();

        sysStatus.innerText = "Codificando I/O Base64...";
        reader.onload = function(e) {
            ws.send(JSON.stringify({
                acao: "enviar_midia", sala: sala, nome_arquivo: arquivo.name,
                mime_type: arquivo.type || "application/octet-stream", base64: e.target.result.split(',')[1]
            }));
            fileInput.value = ""; 
        };
        reader.readAsDataURL(arquivo);
    }

    function solicitarStream(mxc, mxcClean) {
        const container = document.getElementById(`media_${mxcClean}`);
        if(container) container.innerHTML = `<span style="color:var(--primary); font-size:0.8rem;">Descarregando blocos TCP...</span>`;
        ws.send(JSON.stringify({ acao: "baixar_midia", mxc: mxc }));
    }

    function renderizarMidia(mxc, mime, b64) {
        const container = document.getElementById(`media_${mxc.replace(/[^a-zA-Z0-9]/g, '')}`);
        if (!container) return;

        if (mime.startsWith('image/')) container.innerHTML = `<img src="data:${mime};base64,${b64}">`;
        else if (mime.startsWith('audio/')) container.innerHTML = `<audio controls src="data:${mime};base64,${b64}"></audio>`;
        else if (mime.startsWith('video/')) container.innerHTML = `<video controls src="data:${mime};base64,${b64}"></video>`;
        else container.innerHTML = `<a class="btn-download" href="data:${mime};base64,${b64}" download="arquivo">Guardar Arquivo (${mime})</a>`;
        scrollBottom();
    }
</script>
</body>
</html>
